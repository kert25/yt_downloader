<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YT Downloader</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f0f0f;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh}
.container{background:#1a1a1a;border-radius:16px;padding:40px;width:90%;max-width:480px;box-shadow:0 8px 32px rgba(0,0,0,.4)}
h1{font-size:24px;margin-bottom:8px}
.sub{color:#888;font-size:14px;margin-bottom:24px}
input[type=url]{width:100%;padding:14px 16px;background:#252525;border:1px solid #333;border-radius:10px;color:#fff;font-size:15px;outline:none;transition:border .2s}
input[type=url]:focus{border-color:#666}
input[type=url]::placeholder{color:#666}
.formats{display:flex;gap:12px;margin:16px 0}
.formats label{flex:1;padding:12px;background:#252525;border:1px solid #333;border-radius:10px;text-align:center;cursor:pointer;transition:all .2s;font-size:14px}
.formats label:hover{border-color:#555}
.formats input{display:none}
.formats label:has(input:checked){border-color:#ff4444;background:#2a1a1a}
.formats label:has(input:checked) .format-label{color:#fff;font-weight:600}
.format-label{color:#999}
button{width:100%;padding:14px;background:#ff4444;border:none;border-radius:10px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:background .2s;margin-top:4px}
button:hover{background:#e03030}
button:disabled{background:#552222;cursor:not-allowed}
.error{background:#2a1515;border:1px solid #ff444455;border-radius:10px;padding:12px;margin-top:16px;font-size:14px;color:#ff6666}
.spinner{display:none;align-items:center;justify-content:center;gap:8px;margin-top:20px}
.spinner.active{display:flex}
.spinner-dot{width:8px;height:8px;background:#ff4444;border-radius:50%;animation:bounce 1.4s ease-in-out infinite}
.spinner-dot:nth-child(2){animation-delay:.16s}
.spinner-dot:nth-child(3){animation-delay:.32s}
.spinner-text{color:#888;font-size:13px;margin-top:12px;text-align:center;width:100%}
@keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);align-items:center;justify-content:center;z-index:100}
.overlay.active{display:flex}
.modal{background:#1a1a1a;border-radius:16px;padding:32px;width:90%;max-width:400px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.6)}
.modal h2{font-size:20px;margin-bottom:8px}
.modal p{color:#888;font-size:14px;margin-bottom:20px}
.modal .icon{font-size:48px;margin-bottom:12px}
.modal button{width:100%;padding:12px;background:#ff4444;border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s}
.modal button:hover{background:#e03030}
</style>
</head>
<body>
<div class="container">
  <h1>YT Downloader</h1>
  <p class="sub">Вставь ссылку на YouTube — получи файл</p>

  <form id="form">
    <input type="url" id="url-input" placeholder="https://youtube.com/watch?v=..." required>

    <div class="formats">
      <label>
        <input type="radio" name="format" value="mp4" checked>
        <span class="format-label">MP4 (Видео)</span>
      </label>
      <label>
        <input type="radio" name="format" value="mp3">
        <span class="format-label">MP3 (Аудио)</span>
      </label>
    </div>

    <button type="submit" id="btn">Скачать</button>
  </form>

  <div class="spinner" id="spinner">
    <div class="spinner-dot"></div>
    <div class="spinner-dot"></div>
    <div class="spinner-dot"></div>
    <div class="spinner-text">Скачиваю, подожди...</div>
  </div>

  <div class="error" id="error" style="display:none"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="icon">✅</div>
    <h2>Скачивание завершено!</h2>
    <p id="modal-info">Файл сохранён</p>
    <button id="modal-btn">Отлично</button>
  </div>
</div>

<script>
const form = document.getElementById('form');
const urlInput = document.getElementById('url-input');
const btn = document.getElementById('btn');
const spinner = document.getElementById('spinner');
const errorEl = document.getElementById('error');
const overlay = document.getElementById('overlay');
const modalInfo = document.getElementById('modal-info');
const modalBtn = document.getElementById('modal-btn');

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.style.display = 'block';
}

function hideError() {
  errorEl.style.display = 'none';
}

function resetUI() {
  spinner.classList.remove('active');
  btn.disabled = false;
}

form.addEventListener('submit', async function(e) {
  e.preventDefault();
  hideError();

  const url = urlInput.value.trim();
  if (!url) return;

  const format = form.querySelector('input[name="format"]:checked').value;

  spinner.classList.add('active');
  btn.disabled = true;

  try {
    const response = await fetch('/download', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: `url=${encodeURIComponent(url)}&format=${format}`
    });

    if (!response.ok) {
      const text = await response.text();
      const match = text.match(/Ошибка: (.+)/) || text.match(/(.{1,200})/);
      throw new Error(match ? match[1] : text.slice(0, 200));
    }

    let filename = 'video.' + format;
    const disposition = response.headers.get('Content-Disposition');
    if (disposition) {
      const match = disposition.match(/filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/);
      if (match) filename = match[1].replace(/['"]/g, '');
    }

    const blob = await response.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(blobUrl);

    const size = blob.size > 1048576
      ? (blob.size / 1048576).toFixed(1) + ' MB'
      : (blob.size / 1024).toFixed(0) + ' KB';

    modalInfo.textContent = `${filename} (${size})`;
    overlay.classList.add('active');

  } catch (err) {
    showError(err.message);
  } finally {
    resetUI();
  }
});

modalBtn.addEventListener('click', function() {
  overlay.classList.remove('active');
});

overlay.addEventListener('click', function(e) {
  if (e.target === overlay) overlay.classList.remove('active');
});
</script>
</body>
</html>
